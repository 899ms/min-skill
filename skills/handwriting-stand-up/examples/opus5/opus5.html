<style>
:root {
  --ink: #2a2422;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --gold: #a8812f;
  --desk: #f2f2f4;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "New York", ui-serif, Georgia, serif;
  --roman: "Cormorant Garamond", "New York", ui-serif, Georgia, serif;
  --black: "UnifrakturMaguntia", "Luminari", "Apple Chancery", serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--desk);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; font-family: var(--sans); color: var(--text); }

/* ---------- sky & 3D world ---------- */
#sky {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, #e4e4e9 0px, #efeff2 calc(var(--hy, 50vh) - 38vh), var(--floorC, #fff) calc(var(--hy, 50vh) - 4vh), var(--floorC, #fff) var(--hy, 50vh));
  opacity: var(--skyA, 0);
}
#viewport { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 50% 50%; }
#camera { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
#floor {
  position: absolute; left: -40000px; top: -40000px; width: 80000px; height: 80000px;
  background: #fff; opacity: 0;
}
#page { position: absolute; left: 0; top: 0; width: 592px; height: 1280px; transform-style: preserve-3d; }
#plate { position: absolute; left: 0; top: 0; width: 592px; height: 1280px; display: block; transform: translateZ(.05px); }

.flat { position: absolute; left: 0; top: 0; overflow: visible; }
.glyph { position: absolute; transform-style: preserve-3d; }
.glyph .layer { position: absolute; inset: 0; overflow: visible; backface-visibility: visible; }
.gshadow { position: absolute; overflow: visible; }

.stand3d { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.sprite { position: absolute; left: 0; top: 0; transform-style: preserve-3d; pointer-events: none; }

.actor { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.actor .a-shadow { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.actor .a-shadow .blob {
  position: absolute; left: -34px; top: -9px; width: 68px; height: 18px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(30,24,20,.34), rgba(30,24,20,0));
}
.actor .a-shadow .cast { position: absolute; overflow: visible; transform-origin: 50% 100%; filter: blur(2.2px); opacity: .14; }
.actor .a-stand { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0; }
.actor .a-fig { position: absolute; transform-origin: 50% 100%; overflow: visible; }
.actor .a-banner { position: absolute; overflow: visible; transform-origin: 50% 100%; }

.fig .ink { stroke-dasharray: 1 1; stroke-dashoffset: calc(1 - var(--draw, 1)); }
.fig .pig { fill-opacity: var(--fill, 1); }
.fig .pigs { stroke-opacity: var(--fill, 1); }
.fig text { font-family: var(--serif); }

.tag {
  position: absolute; white-space: nowrap; font-family: var(--serif); font-weight: 600;
  font-size: 10.5px; line-height: 1; color: var(--ink); letter-spacing: .02em;
  padding: 4.5px 6px 4px; background: #f8f0dd; border: .8px solid var(--ink); border-radius: 1.5px;
  box-shadow: 0 1.5px 0 rgba(42,36,34,.18);
}

/* ---------- phone ---------- */
#phone { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
#phone .screen { position: absolute; overflow: hidden; background: transparent; }
#phone video, #phone .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; }
#phone .bezel { position: absolute; inset: 0; border-style: solid; border-color: #0c0c0d; }
#phone .rim { position: absolute; inset: 0; box-shadow: 0 0 0 1px #b9b9bf, 0 0 0 2.5px #e3e3e7, 0 40px 80px -20px rgba(0,0,0,.28), 0 12px 30px rgba(0,0,0,.10); }
#phone .island { position: absolute; background: #050505; border-radius: 999px; }
#phone .btn { position: absolute; background: linear-gradient(to right, #9d9da3, #d6d6db); border-radius: 2px; }
#phone.dev-card .rim { box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 30px 70px -18px rgba(0,0,0,.26), 0 10px 26px rgba(0,0,0,.08); }

/* ---------- overlays ---------- */
#spot {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse var(--sw, 46vw) var(--sh, 40vh) at var(--sx, 50%) var(--sy, 55%), rgba(14,12,11,0) 0%, rgba(14,12,11,.05) 28%, rgba(14,12,11,.42) 50%, rgba(14,12,11,.8) 72%, rgba(14,12,11,.93) 100%);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse 75% 70% at 50% 58%, rgba(236,234,230,0) 55%, rgba(222,220,216,.55) 100%);
}
#glow5 {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(circle var(--gr, 120px) at var(--gx, 70%) var(--gy, 40%), rgba(255,214,120,.55) 0%, rgba(240,180,70,.22) 35%, rgba(240,180,70,0) 100%);
}
#scrim {
  position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none; opacity: 0;
}
#spotbeam {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 22vw 70vh at var(--sx, 50%) -10%, rgba(255,236,200,.16), rgba(255,236,200,0) 70%);
}

#title { position: absolute; left: 0; right: 0; top: 11vh; text-align: center; pointer-events: none; }
#title .t1 { font-size: clamp(44px, 7.4vw, 96px); font-weight: 600; letter-spacing: -.035em; line-height: 1.02; }
#title .t1 span { background: linear-gradient(180deg, #3a3a3c 0%, #0b0b0c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .02em; }
#title .t2 { margin-top: .5em; font-size: clamp(17px, 2.1vw, 26px); font-weight: 500; color: var(--muted); letter-spacing: .02em; }
#title span { display: inline-block; }

#captions { position: absolute; left: 0; right: 0; bottom: max(7.5vh, calc(env(safe-area-inset-bottom) + 64px)); height: 0; pointer-events: none; }
.cap { position: absolute; left: 50%; bottom: 0; width: min(92vw, 900px); transform: translateX(-50%); text-align: center; visibility: hidden; }
.cap .eb { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--capGold, var(--gold)); margin-bottom: 12px; }
.cap .ln { text-wrap: balance; font-family: var(--serif); font-size: clamp(19px, 2.2vw + 8px, 32px); font-weight: 600; letter-spacing: .04em; line-height: 1.45; color: var(--capInk, var(--text)); }
.cap .nt { margin-top: 10px; font-family: var(--serif); font-size: clamp(14px, 1.3vw, 17px); font-weight: 500; letter-spacing: .06em; color: var(--capMuted, var(--muted)); }
.cap .ln .ch { display: inline-block; }

#rcback { position: absolute; inset: 0; pointer-events: none; visibility: hidden;
  background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(12,10,9,.62), rgba(12,10,9,.9));
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
#roundcard { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.rc { position: absolute; text-align: center; visibility: hidden; }
.rc .num { font-family: var(--roman); font-weight: 300; font-size: clamp(120px, 20vw, 260px); line-height: .9; letter-spacing: .02em;
  background: linear-gradient(180deg, #f7e7b4 0%, #d8b25b 42%, #9c7426 70%, #e6c77a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 30px rgba(215,170,80,.35)); }
.rc .lbl { margin-top: 22px; font-size: 12px; font-weight: 600; letter-spacing: .5em; color: #e3cc95; text-indent: .5em; }
.rc .zh { margin-top: 10px; font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .5em; color: #f5f0e6; text-indent: .5em; }

/* ---------- intro ---------- */
#intro { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer; }
#intro .inner { display: flex; flex-direction: column; align-items: center; gap: 10px; transform: translateY(2vh); }
#intro .play {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 18px;
  background: rgba(255,255,255,.55); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
#intro:hover .play { transform: scale(1.06); }
#intro .play svg { width: 24px; height: 24px; margin-left: 4px; }
#intro .k1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; color: var(--text); }
#intro .k2 { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: .08em; }
#intro .k3 { margin-top: 26px; font-size: 11px; font-weight: 600; letter-spacing: .3em; color: #a1a1a6; text-transform: uppercase; }

/* ---------- hud ---------- */
#hud { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 8px; opacity: 0; transition: opacity .6s; }
#hud.show { opacity: 1; }
#hud button {
  width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
  background: rgba(250,250,252,.62); backdrop-filter: blur(14px) saturate(1.5); -webkit-backdrop-filter: blur(14px) saturate(1.5);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.1), 0 4px 14px rgba(0,0,0,.08); color: #1d1d1f;
}
#hud button svg { width: 15px; height: 15px; }
#progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #c9a45a, #1d1d1f); opacity: .5; }

#endcard { position: absolute; left: 0; right: 0; bottom: max(5vh, calc(env(safe-area-inset-bottom) + 30px)); display: flex; flex-direction: column; align-items: center; gap: 14px; visibility: hidden; }
#endcard .fin { font-family: var(--roman); font-style: italic; font-size: 22px; color: var(--muted); letter-spacing: .08em; }
#endcard button {
  font: 600 14px var(--sans); letter-spacing: .04em; color: #fff; background: #1d1d1f; border: 0; border-radius: 999px; padding: 11px 22px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
</style>
</head>

    r2: ['奥特曼换了打法：连环发布。', '达里奥翻开随身的小书——《宪法》。', '每一拳，都被原则挡了回去。'],
    tags: ['新模型！', '新硬件！', '新浏览器！', '新功能！', '又一场发布会！', '敬请期待！', '新模型！！', 'Coming soon', '再来一个！', '下周见！'],
    r3: [['达里奥终于出手。', '他向身后的「5」，借了一点光。'], '只出了一拳。', '一拳，把奥特曼打回了纸上。'],
    count: ['蜗牛开始读秒——', '它数得……非常……慢。'],
    countSigns: ['一', '二', '三'],
    help: '还没数到三，达里奥先把对手扶了起来。',
    ask: '所以，谁赢了？',
    end: '答案，一直写在纸上。',
  };

  return {
    meta: { title: 'Opus 5', tagline: '一行字，站起来之后的故事', hero: ['Opus', '5'], heroSub: '站起来了。', docTitle: 'Opus 5 · 站起来了' },

    build(S) {
      const { WORD, glyphs, GUARD } = S;
      const first = glyphs[0], last = glyphs[glyphs.length - 1];
      const R = S.ring({ cx: WORD.cx });
      const cx = R.cx, FY = R.y0 + 120;                 // the fighters' line
      Object.assign(S.stage.spot, { x: cx, y: FY, z: 70 });

      const L = S.knight(Object.assign({ x: cx - 106, y: FY, mirror: false }, CAST.left));
      const Rv = S.knight(Object.assign({ x: cx + 106, y: FY, mirror: true }, CAST.right));
      const snail = S.snail({ x: R.x0 - 46, y: FY + 96 });
      const pose = S.pose, to = S.to, set = S.set, sfx = S.sfx, cap = S.caption;
      // long lines of writing: pull the camera back a little so the backdrop isn't just two giant strokes
      const k = Math.min(1.45, Math.sqrt(Math.max(1, WORD.w / 520)));
      const shot = (t, v, dur, ease) => S.shot(t, Object.assign({}, v, v.span ? { span: v.span * k, pspan: v.pspan * Math.min(1.3, k) } : {}), dur, ease);

      /* 0 · the ink stands up */
      S.rise(0);

      /* 1 · prologue */
      S.music.start(8.8, 0.5);
      shot(9.0, { tilt: 53, x: cx, y: R.y0 + 48, z: 50, span: 860, pspan: 610, yaw: 4, oy: -0.02 }, 2.6);
      cap(9.7, 13.1, LINES.prologue[0], LINES.prologue[1]);
      S.drawRing(R, 10.0);
      cap(13.3, 16.3, '', LINES.arrive);
      S.writeIn(L, 14.2);
      cap(16.5, 19.6, CAST.left.banner, LINES.left[0], LINES.left[1]);
      to(L.s, { idle: 0.6, duration: 1 }, 16.4);
      S.writeIn(Rv, 17.2);
      cap(19.8, 22.9, CAST.right.banner, LINES.right[0], LINES.right[1]);
      to(Rv.s, { idle: 0.6, duration: 1 }, 19.4);

      shot(22.4, { tilt: 73, span: 700, pspan: 430, y: FY - 22, z: 100, yaw: 0, x: cx + 4, oy: -0.035 }, 2.4);
      cap(23.1, 26.4, '', LINES.claim);
      to(L.a, { x: cx - 70, duration: 1.1, ease: 'power2.inOut' }, 23.3);
      to(Rv.a, { x: cx + 70, duration: 1.1, ease: 'power2.inOut' }, 23.5);

      /* 2 · round one: the big swing */
      S.lights(30.4, 1);
      S.music.drum(30.4, true);
      S.card(31.0, 'I', 'ROUND ONE', '第一回合');
      to(L.a, { x: cx - 46, duration: 0.9, ease: 'power2.inOut' }, 33.0);
      to(Rv.a, { x: cx + 46, duration: 0.9, ease: 'power2.inOut' }, 33.1);
      cap(33.5, 35.6, 'Round I', LINES.r1[0]);
      pose(Rv, { fx: 62, fy: 78, lean: -10, head: -4, duration: 0.8, ease: 'power2.inOut' }, 34.1);
      pose(Rv, { gF: 3.3, label: 1, duration: 1.3, ease: 'elastic.out(1, 0.55)' }, 34.5);
      sfx(34.5, 'inflate');
      set(L.s, { face: 'firm' }, 34.6);
      cap(35.7, 38.0, 'Round I', LINES.r1[1]);
      to(Rv.a, { x: cx + 4, duration: 0.28, ease: 'power3.in' }, 37.2);
      pose(Rv, { fx: 116, fy: 64, lean: 12, head: 6, duration: 0.26, ease: 'power3.in' }, 37.2);
      pose(L, { by: 17, lean: -12, head: -14, idle: 0, duration: 0.2, ease: 'power3.out' }, 37.2);
      sfx(37.25, 'whiff');
      to(Rv.a, { spin: 360, duration: 0.75, ease: 'power2.out' }, 37.45);
      to(Rv.a, { x: cx - 10, duration: 0.7, ease: 'power2.out' }, 37.45);
      set(Rv.s, { face: 'ouch' }, 37.5);
      pose(Rv, { gF: 1, label: 0, fx: GUARD.fx, fy: GUARD.fy, lean: 0, head: 0, duration: 0.7, ease: 'power2.inOut' }, 38.1);
      set(Rv.a, { spin: 0 }, 38.21);
      pose(L, { by: 0, lean: 0, head: 0, idle: 1, duration: 0.6, ease: 'power2.inOut' }, 38.5);
      set(L.s, { face: 'smile' }, 38.6);
      cap(38.1, 40.3, 'Round I', LINES.r1[2]);
      S.rock(first, 37.5);
      sfx(37.55, 'whoosh', 0.6);
      cap(40.4, 43.4, 'Round I', LINES.r1[3]);
      to(Rv.a, { x: cx + 46, duration: 0.9, ease: 'power2.inOut' }, 40.2);
      set(Rv.s, { face: 'grin' }, 40.6);

      /* 3 · round two: a flurry, blocked by a little book */
      S.card(43.8, 'II', 'ROUND TWO', '第二回合');
      cap(45.8, 48.6, 'Round II', LINES.r2[0]);
      pose(L, { book: 1, fx: 91, fy: 58, face: 'calm', duration: 0.5, ease: 'back.out(1.6)' }, 46.1);
      sfx(46.1, 'pop');
      LINES.tags.forEach((txt, i) => {
        const t = 46.5 + i * 0.46;
        const tg = S.tag(txt, i), hs = S.star();
        pose(Rv, { fx: 112, fy: 62 + (i % 3) * 3, lean: 7, duration: 0.11, ease: 'power3.in' }, t);
        pose(Rv, { fx: GUARD.fx, fy: GUARD.fy, lean: 0, duration: 0.22, ease: 'power2.out' }, t + 0.13);
        pose(L, { bx: -3, duration: 0.08, ease: 'power2.out' }, t + 0.1);
        pose(L, { bx: 0, duration: 0.25, ease: 'power2.inOut' }, t + 0.18);
        sfx(t + 0.1, 'ting');
        set(hs, { a: 1, sc: 0.2, rot: i * 40, x: cx - 10, y: FY + 9, h: 84 }, t + 0.1);
        to(hs, { sc: 1.1, rot: i * 40 + 30, duration: 0.25, ease: 'power2.out' }, t + 0.1);
        to(hs, { a: 0, duration: 0.2 }, t + 0.3);
        const side = i % 2 ? 1 : -1;
        set(tg, { a: 0, x: cx + 4, y: FY + 9, h: 116, sc: 0.5, rot: 0 }, t + 0.12);

      cap(52.0, 55.0, 'Round II', LINES.r2[2]);
      pose(Rv, { lean: 16, by: 7, face: 'tired', sweat: 1, idleRate: 0.55, fx: 96, fy: 94, gbx: 84, gby: 100, duration: 0.9, ease: 'power2.inOut' }, 51.4);
      pose(L, { book: 0, fx: GUARD.fx, fy: GUARD.fy, duration: 0.6, ease: 'power2.inOut' }, 53.2);

      /* 4 · round three: light borrowed from the last glyph, one punch */
      S.card(55.4, 'III', 'ROUND THREE', '第三回合');
      pose(Rv, { lean: 0, by: 0, sweat: 0.4, idleRate: 1, fx: GUARD.fx, fy: GUARD.fy, gbx: GUARD.gbx, gby: GUARD.gby, face: 'grin', duration: 0.8, ease: 'power2.inOut' }, 56.2);
      cap(57.4, 60.6, 'Round III', LINES.r3[0][0], LINES.r3[0][1]);
      shot(57.3, { x: cx + (last.cx - cx) * 0.3, yaw: -10, tilt: 68, span: 640, pspan: 500, y: FY - 52, z: 90 }, 1.8);
      to(last, { glow: 1, duration: 1.0, ease: 'power2.inOut' }, 57.9);
      sfx(57.9, 'sparkle');
      const sp0 = { x: last.cx, y: last.pivot + 10, h: (last.pivot - last.top) * 0.55 }, sp1 = { x: cx - 16, y: FY + 9, h: 78 };
      [S.spark(), ...Array.from({ length: 7 }, () => S.spark())].forEach((s, i) => {
        const d = i ? 0.07 * i : 0;
        set(s, { a: i ? 0.7 - (i - 1) * 0.08 : 1, x: sp0.x, y: sp0.y, h: sp0.h, sc: i ? 1.6 - (i - 1) * 0.16 : 0.4 }, 58.9 + d);

        to(s, { x: sp1.x, y: sp1.y, duration: 1.1, ease: 'power2.inOut' }, 59.0 + d);
        to(s, { h: sp0.h + 60, duration: 0.55, ease: 'power2.out' }, 59.0 + d);
        to(s, { h: sp1.h, duration: 0.55, ease: 'power2.in' }, 59.55 + d);

      });
      sfx(59.0, 'whoosh', 1.2);
      pose(L, { glowF: 1, face: 'firm', duration: 0.4 }, 60.0);
      sfx(60.05, 'ting');
      to(last, { glow: 0.25, duration: 1.2 }, 60.4);
      cap(60.8, 62.9, 'Round III', LINES.r3[1]);
      shot(60.4, { x: cx + 8, span: 430, pspan: 300, tilt: 74, yaw: -12, y: FY, z: 70, oy: 0.02 }, 1.7);
      pose(L, { by: 11, lean: -7, fx: 86, fy: 106, idle: 0, duration: 0.4, ease: 'power2.inOut' }, 61.8);
      to(L.a, { x: cx - 6, duration: 0.25, ease: 'power3.in' }, 62.2);
      pose(L, { by: -5, lean: 13, fx: 106, fy: 34, duration: 0.17, ease: 'power4.out' }, 62.25);
      sfx(62.36, 'punch', true);
      S.music.level(62.36, 0, 0.08);
      S.shake(62.36, 1, 0.6);
      Array.from({ length: 7 }, (_, i) => S.star(i % 2 ? '#f2d27a' : '#fff4d6')).forEach((s, i) => {
        const ang = (i / 7) * Math.PI * 2 + 0.3;
        set(s, { a: 1, x: cx + 26, y: FY + 9, h: 92, sc: 0.3, rot: i * 50 }, 62.36);
        to(s, { x: cx + 26 + Math.cos(ang) * 44, h: 92 + Math.sin(ang) * 36, sc: 1, rot: i * 50 + 90, duration: 0.6, ease: 'power3.out' }, 62.36);
        to(s, { a: 0, sc: 0.6, duration: 0.35 }, 62.8);
      });
      set(Rv.s, { eyes: 'x', face: 'ouch' }, 62.37);
      pose(Rv, { idle: 0, head: 22, lean: -18, duration: 0.12 }, 62.37);
      to(Rv.a, { lift: 82, duration: 0.95, ease: 'power2.out' }, 62.38);
      to(Rv.a, { lift: 0, duration: 0.55, ease: 'power2.in' }, 63.33);
      to(Rv.a, { spin: -720, duration: 1.45, ease: 'power1.inOut' }, 62.38);
      to(Rv.a, { x: cx + 40, duration: 1.5, ease: 'power1.out' }, 62.38);
      to(Rv.a, { rx: 0, duration: 0.42, ease: 'power2.in' }, 63.46);       // folds flat onto the page…
      to(Rv.a, { tip: 68, duration: 0.5, ease: 'power2.inOut' }, 63.4);    // …sprawled sideways so it reads as "down"
      to(Rv.a, { rx: -13, duration: 0.14, ease: 'power2.out' }, 63.88);
      to(Rv.a, { rx: 0, duration: 0.3, ease: 'bounce.out' }, 64.02);
      set(Rv.a, { spin: 0 }, 63.84);
      sfx(63.88, 'flop');
      S.shake(63.88, 0.7, 0.5);
      Array.from({ length: 6 }, () => S.dust()).forEach((d, i) => {
        set(d, { a: 0.9, x: cx + 64 + i * 14, y: FY - 10 - (i % 3) * 18, h: 4, sc: 0.4 }, 63.88);
        to(d, { x: cx + 54 + i * 22, h: 16 + (i % 2) * 10, sc: 2.2, a: 0, duration: 0.9, ease: 'power2.out' }, 63.88);
      });
      pose(L, { by: 0, lean: 0, fx: GUARD.fx, fy: GUARD.fy, idle: 0.7, glowF: 0, duration: 0.8, ease: 'power2.inOut' }, 62.8);
      to(last, { glow: 0, duration: 1.0 }, 63.0);
      // look down on the page: the flattened knight is a drawing again
      shot(64.1, { tilt: 34, span: 560, pspan: 380, x: cx + 64, y: FY - 22, z: 0, yaw: 0, oy: -0.02 }, 2.2, 'power3.inOut');
      Object.assign(S.dizzy, { x: cx + 124, y: FY - 34 });
      to(S.dizzy, { a: 1, duration: 0.5 }, 64.3);
      to(S.dizzy, { a: 0, duration: 0.4 }, 75.2);
      cap(64.4, 67.8, '', LINES.r3[2]);

      /* 5 · the (very slow) count */
      to(snail.a, { x: cx + 142, y: FY + 40, duration: 3.6, ease: 'power1.inOut' }, 64.8);
      to(snail.state, { sign: 1, duration: 0.4, ease: 'back.out(2)' }, 67.9);
      snail.signs.push([0, LINES.countSigns[0]], [72.85, LINES.countSigns[1]], [77.7, LINES.countSigns[2]]);
      sfx(68.0, 'tick'); sfx(72.9, 'tick'); sfx(77.75, 'tick');
      cap(68.0, 70.5, '', LINES.count[0]);
      cap(70.7, 73.9, '', LINES.count[1]);
      S.music.start(71.0, 0.28);
      S.music.drum(71.0, false);

      /* 6 · a hand up */
      shot(73.2, { tilt: 68, span: 540, pspan: 390, x: cx + 54, y: FY, z: 60, yaw: 3, oy: -0.03 }, 2.4);
      to(L.a, { x: cx + 2, duration: 1.4, ease: 'power2.inOut' }, 73.2);
      cap(74.2, 78.0, '', LINES.help);
      set(L.s, { face: 'smile' }, 74.7);
      pose(L, { lean: 18, fx: 104, fy: 116, idle: 0, duration: 0.55, ease: 'power2.inOut' }, 74.7);
      to(Rv.a, { rx: -90, duration: 0.95, ease: 'back.out(1.7)' }, 75.3);
      to(Rv.a, { tip: 0, duration: 0.7, ease: 'power2.out' }, 75.3);
      sfx(75.3, 'pop');
      set(Rv.s, { eyes: 'open', face: 'tired' }, 75.6);
      pose(Rv, { head: 0, lean: 0, sweat: 0.6, duration: 0.6 }, 75.6);
      pose(L, { lean: 0, fx: GUARD.fx, fy: GUARD.fy, duration: 0.6, ease: 'power2.inOut' }, 75.6);
      to(Rv.a, { x: cx + 76, duration: 0.6, ease: 'power2.out' }, 75.6);
      pose(L, { fx: 110, fy: 70, duration: 0.3, ease: 'power2.out' }, 76.7);
      set(Rv.s, { face: 'smile' }, 76.7);
      pose(Rv, { fx: 110, fy: 70, sweat: 0, duration: 0.3, ease: 'power2.out' }, 76.7);
      sfx(76.95, 'sparkle');
      const bump = S.star();
      set(bump, { a: 1, x: cx + 39, y: FY + 9, h: 78, sc: 0.3, rot: 0 }, 76.98);
      to(bump, { sc: 1.4, rot: 60, duration: 0.4, ease: 'power2.out' }, 76.98);
      to(bump, { a: 0, duration: 0.3 }, 77.4);
      pose(L, { fx: GUARD.fx, fy: GUARD.fy, idle: 0.5, duration: 0.5 }, 77.5);
      pose(Rv, { fx: GUARD.fx, fy: GUARD.fy, idle: 0.5, duration: 0.5 }, 77.5);

      /* 7 · back onto the page */
      S.lights(78.2, 0, 1.4);
      S.music.level(78.2, 0.45, 0.8);
      cap(78.5, 81.2, '', LINES.ask);
      // walk to the front of the ring first, so the folded doodles don't land on the lettering
      to(L.a, { x: cx - 70, y: FY + 80, duration: 1.2, ease: 'power2.inOut' }, 78.6);
      to(Rv.a, { x: cx + 70, y: FY + 80, duration: 1.2, ease: 'power2.inOut' }, 78.7);
      to(snail.a, { x: cx - 14, y: FY + 104, duration: 2.2, ease: 'power1.inOut' }, 78.6);
      pose(L, { lean: 22, head: 10, idle: 0, duration: 0.5, ease: 'power2.inOut' }, 79.8);
      pose(L, { lean: 0, head: 0, duration: 0.5, ease: 'power2.inOut' }, 80.4);
      pose(Rv, { lean: 22, head: 10, idle: 0, duration: 0.5, ease: 'power2.inOut' }, 79.95);
      pose(Rv, { lean: 0, head: 0, duration: 0.5, ease: 'power2.inOut' }, 80.55);
      to(snail.state, { sign: 0, duration: 0.4 }, 80.4);
      S.finale(81.0, LINES.end);
    },
  };
})();

<script>
/* handwriting-stand-up · engine
 *
 * Reads window.SOURCE (written by scripts/prepare.py) and window.STORY (story.js),
 * builds a CSS-3D paper stage on which the traced handwriting stands up, then hands
 * a toolkit `S` to STORY.build(S) so the story can choreograph on ONE paused GSAP
 * timeline. Everything is seekable: window.__seek(t) renders any moment.
 *
 * Page units: the page is SOURCE.page[0] × SOURCE.page[1] (the source frame, rescaled
 * so the written word is ~233 units tall). 3D: x → right, y → down the page (towards
 * the viewer once the camera tilts), z/h → up off the paper.
 */
(() => {
  'use strict';

  const SRC = window.SOURCE, STORY = window.STORY;
  if (!SRC || !STORY) { document.body.textContent = 'missing SOURCE or STORY'; return; }

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const NS = 'http://www.w3.org/2000/svg';
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;

  const PAGE_W = SRC.page[0], PAGE_H = SRC.page[1];
  const INK = '#2a2422';
  const SKIN = '#f3d9c1';
  const PARCH = '#f7eedb';
  const META = Object.assign({ title: 'Stand Up', tagline: '一行字，站起来之后的故事', hero: ['Stand', 'Up'], heroSub: '站起来了。', fin: 'Finis.', replay: '再看一遍', hint: '轻点开始 · 建议开声音' }, STORY.meta || {});

  const svgEl = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const div = (cls, parent, style) => {
    const e = document.createElement('div');
    if (cls) e.className = cls;
    if (style) Object.assign(e.style, style);
    if (parent) parent.appendChild(e);
    return e;
  };

  /* ------------------------------------------------------------------ */
  /* Copy                                                                */
  /* ------------------------------------------------------------------ */
  document.title = META.docTitle || `${META.title} · ${META.heroSub}`;
  $('#intro .k1').textContent = META.title;
  $('#intro .k2').textContent = META.tagline;
  $('#intro .k3').textContent = META.hint;
  $('#title .t1').innerHTML = META.hero.map((w) => `<span>${w}</span>`).join(' ');
  $('#title .t2').innerHTML = `<span>${META.heroSub}</span>`;
  $('#endcard .fin').textContent = META.fin;
  $('#replay2').textContent = META.replay;

  /* ------------------------------------------------------------------ */
  /* Layout: the device mock the recording plays in                      */
  /* ------------------------------------------------------------------ */
  const V = { w: innerWidth, h: innerHeight, s0: 0.5, P: 1800 };
  const phone = $('#phone');
  const viewport = $('#viewport');
  const DEVICE = SRC.device || (SRC.video ? 'phone' : 'card');
  phone.classList.add('dev-' + DEVICE);

  function layout() {
    V.w = innerWidth; V.h = innerHeight;
    const aspect = PAGE_W / PAGE_H;
    let screenW = V.w * 0.84, screenH = screenW / aspect;
    if (screenH > V.h * 0.8) { screenH = V.h * 0.8; screenW = screenH * aspect; }
    const phoneLike = DEVICE === 'phone';
    const b = phoneLike ? Math.max(6, Math.min(screenW, screenH) * 0.035) : 0;
    V.s0 = screenH / PAGE_H;
    const W = screenW + b * 2, H = screenH + b * 2;
    const r = phoneLike ? Math.min(screenW, screenH) * 0.155 : 14;
    Object.assign(phone.style, { width: W + 'px', height: H + 'px' });
    Object.assign($('.screen', phone).style, { left: b + 'px', top: b + 'px', width: screenW + 'px', height: screenH + 'px', borderRadius: r + 'px' });
    Object.assign($('.bezel', phone).style, { borderWidth: b + 'px', borderRadius: (r + b) + 'px' });
    Object.assign($('.rim', phone).style, { borderRadius: (r + b) + 'px' });
    const island = $('.island', phone);
    if (phoneLike && aspect < 1) {
      const iw = screenW * 0.31, ih = screenW * 0.088;
      Object.assign(island.style, { display: 'block', width: iw + 'px', height: ih + 'px', left: (W - iw) / 2 + 'px', top: b + screenH * 0.0125 + 'px' });

    P.mouths = {

    };
    P.sweat = svgEl('path', { d: 'M52 34 q-2.6 4 0 5.4 q2.6 -1.4 0 -5.4 Z M88 30 q-2.2 3.4 0 4.6 q2.2 -1.2 0 -4.6 Z', fill: '#bfe0f0', stroke: INK, 'stroke-width': 0.8, opacity: 0 }, head);

  function ik(sx, sy, tx, ty, l1, l2, px, py) {
    let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 0.001;
    const max = l1 + l2 - 0.01;
    if (d > max) { tx = sx + dx / d * max; ty = sy + dy / d * max; dx = tx - sx; dy = ty - sy; d = max; }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    let nx = -uy, ny = ux;
    if (nx * px + ny * py < 0) { nx = -nx; ny = -ny; }
    return { ex: sx + ux * a + nx * h, ey: sy + uy * a + ny * h, tx, ty };
  }

  const GUARD = { fx: 93, fy: 66, gbx: 81, gby: 73 };
  const REST = { fx: 78, fy: 112, gbx: 60, gby: 112 };   // arms hanging, for non-fighting stories
  class Figure {
    constructor(o) {
      this.o = o;
      const { svg, P } = buildFigureSVG(o);
      this.svg = svg; this.P = P;
      const arms = o.hands === 'hands' ? REST : GUARD;
      this.s = { bx: 0, by: 0, lean: 0, head: 0, fx: arms.fx, fy: arms.fy, gbx: arms.gbx, gby: arms.gby, gF: 1, glowF: 0,
        footBx: 47, footBy: 173, footFx: 80, footFy: 173, idle: 0, idleRate: 1, book: 0, sweat: 0, draw: 0, fill: 0,
        face: o.face || 'calm', eyes: 'open', label: 0 };
      this.phase = o.phase || 0;
      this._face = null; this._eyes = null;
    }
    render(t) {
      const s = this.s, P = this.P;
      const w = t * TAU * 1.55 * s.idleRate + this.phase;
      const bob = Math.sin(w) * 2.1 * s.idle;
      const sway = Math.sin(w * 0.5) * 1.6 * s.idle;
      const bx = s.bx + sway * 0.6, by = s.by + Math.abs(bob) * 1.2;
      P.body.setAttribute('transform', `translate(${bx.toFixed(2)} ${by.toFixed(2)}) rotate(${(s.lean + sway * 0.5).toFixed(2)} 62 124)`);
      P.head.setAttribute('transform', `translate(0 3.5) rotate(${(s.head + Math.sin(w + 1) * 1.5 * s.idle).toFixed(2)} 62 70)`);
      const gb = Math.sin(w + 0.6) * 1.8 * s.idle;
      const fa = ik(74, 84, s.fx, s.fy + gb, 17.5, 17.5, -0.35, 1);
      const ba = ik(55, 85, s.gbx, s.gby - gb, 17.5, 17.5, -0.35, 1);
      const armD = (sx, sy, a) => `M${sx} ${sy} L${a.ex.toFixed(2)} ${a.ey.toFixed(2)} L${a.tx.toFixed(2)} ${a.ty.toFixed(2)}`;
      const dF = armD(74, 84, fa), dB = armD(55, 85, ba);
      P.armF.ol.setAttribute('d', dF); P.armF.fl.setAttribute('d', dF);
      P.armB.ol.setAttribute('d', dB); P.armB.fl.setAttribute('d', dB);
      const angF = Math.atan2(fa.ty - fa.ey, fa.tx - fa.ex) * 180 / Math.PI;
      const angB = Math.atan2(ba.ty - ba.ey, ba.tx - ba.ex) * 180 / Math.PI;
      const rotF = angF * 0.55 - 20;
      P.gloveF.g.setAttribute('transform', `translate(${fa.tx.toFixed(2)} ${fa.ty.toFixed(2)}) rotate(${rotF.toFixed(2)}) scale(${s.gF.toFixed(3)})`);
      P.gloveB.g.setAttribute('transform', `translate(${ba.tx.toFixed(2)} ${ba.ty.toFixed(2)}) rotate(${(angB * 0.55 - 20).toFixed(2)})`);
      P.gloveF.g.style.filter = s.glowF > 0.01 ? `drop-shadow(0 0 ${6 * s.glowF}px rgba(245,200,95,${s.glowF}))` : '';
      if (P.gloveLabel) {
        P.gloveLabel.setAttribute('opacity', s.label);
        P.gloveLabel.setAttribute('transform', `rotate(${(-rotF).toFixed(2)} 9 0)${this.o.mirror ? ' translate(18 0) scale(-1 1)' : ''}`);
      }
      if (P.book) {
        P.book.setAttribute('opacity', s.book);
        P.book.setAttribute('transform', `translate(${(fa.tx + 3).toFixed(2)} ${(fa.ty - 5).toFixed(2)}) scale(${(this.o.mirror ? -1 : 1) * (0.6 + 0.4 * s.book)} ${(0.6 + 0.4 * s.book).toFixed(3)})`);
      }
      const lean = (s.lean * Math.PI) / 180;
      const hipX = (hx) => bx + 62 + (hx - 62) * Math.cos(lean);
      const hipY = by + 125;
      const legD = (hx, fx, fy) => {
        const a = ik(hipX(hx), hipY, fx, fy - 2, 25, 25, 1, -0.15);
        return `M${hipX(hx).toFixed(2)} ${hipY.toFixed(2)} L${a.ex.toFixed(2)} ${a.ey.toFixed(2)} L${fx.toFixed(2)} ${(fy - 2).toFixed(2)}`;
      };
      const lB = legD(57, s.footBx, s.footBy), lF = legD(68, s.footFx, s.footFy);
      P.legB.ol.setAttribute('d', lB); P.legB.fl.setAttribute('d', lB);
      P.legF.ol.setAttribute('d', lF); P.legF.fl.setAttribute('d', lF);
      P.legB.shoe.setAttribute('transform', `translate(${s.footBx.toFixed(2)} ${s.footBy.toFixed(2)})`);
      P.legF.shoe.setAttribute('transform', `translate(${s.footFx.toFixed(2)} ${s.footFy.toFixed(2)})`);
      if (s.face !== this._face) {
        this._face = s.face;
        for (const k in P.mouths) P.mouths[k].setAttribute('display', k === s.face ? 'inline' : 'none');
      }
      const blink = s.eyes === 'open' && ((t * 0.31 + this.phase * 0.13) % 1) < 0.022;
      const eyes = blink ? 'shut' : s.eyes;
      if (eyes !== this._eyes) {
        this._eyes = eyes;
        P.eyesOpen.setAttribute('display', eyes === 'open' ? 'inline' : 'none');
        P.eyesX.setAttribute('display', eyes === 'x' ? 'inline' : 'none');
        P.eyesShut.setAttribute('display', eyes === 'shut' ? 'inline' : 'none');
      }
      P.sweat.setAttribute('opacity', s.sweat);
      this.svg.style.setProperty('--draw', s.draw);
      this.svg.style.setProperty('--fill', s.fill);
    }
  }

  function buildSnailSVG(SN) {
    const s = svgEl('svg', { viewBox: '0 0 80 60', width: 80 * SN, height: 60 * SN, overflow: 'visible', class: 'fig' });
    s.style.overflow = 'visible';
    const g = svgEl('g', {}, s);
    const body = svgEl('path', { d: 'M4 57 C8 51 20 50 42 51 C52 51 57 46 59 39 C60 34 64 33 66.5 36.5 C68 41 66 49 63 53 C60 57 52 58 40 58 L8 58 C4 58 2 58 4 57 Z', fill: '#cfd4b4', stroke: INK, 'stroke-width': 1.6, class: 'ink pig', pathLength: 1 }, g);
    svgEl('path', { d: 'M61 37 L62 22 M65 37 L70.5 24', stroke: INK, 'stroke-width': 1.6, 'stroke-linecap': 'round', fill: 'none', class: 'ink', pathLength: 1 }, g);
    svgEl('circle', { cx: 62, cy: 21, r: 2.3, fill: INK, class: 'pig' }, g);
    svgEl('circle', { cx: 70.8, cy: 23, r: 2.3, fill: INK, class: 'pig' }, g);
    svgEl('path', { d: 'M63.6 45.5 q2 1.6 3.4 -.4', stroke: INK, 'stroke-width': 1.1, fill: 'none', 'stroke-linecap': 'round', class: 'pigs' }, g);

    svgEl('path', { d: spiral(33, 36, 1.2, 14.5, 2.4), fill: 'none', stroke: INK, 'stroke-width': 1.3, 'stroke-linecap': 'round', class: 'ink', pathLength: 1 }, shell);
    const sign = svgEl('g', { opacity: 0 }, g);
    svgEl('path', { d: 'M54 50 L54 6', stroke: '#6b4a2e', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, sign);
    svgEl('rect', { x: 40, y: -12, width: 28, height: 20, rx: 2.5, fill: PARCH, stroke: INK, 'stroke-width': 1.5 }, sign);
    const num = svgEl('text', { x: 54, y: 3.6, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#8e2f22' }, sign);
    return { svg: s, body, shell, sign, num };
  }

  /* actors: a foot point on the paper + a pop-up card that can stand, spin, fly and fold */
  const actors = [];
  function makeActor(o) {
    const el = div('actor', page);
    const sh = div('a-shadow', el);
    const blob = div('blob', sh);
    const stand = div('a-stand', el);
    const figWrap = div('a-fig', stand);
    const a = { el, sh, blob, stand, figWrap, x: o.x, y: o.y, rx: 0, lift: 0, spin: 0, tip: 0, a: 0, w: o.w, h: o.h, name: o.name, fold: o.fold !== false };
    figWrap.appendChild(o.svg);
    Object.assign(figWrap.style, { left: -o.ax + 'px', top: -o.foot + 'px', width: o.w + 'px', height: o.h + 'px' });
    blob.style.transform = `scale(${o.w / 68}, 1)`;
    if (o.castId) {
      const cast = svgEl('svg', { class: 'cast', viewBox: o.viewBox, width: o.w, height: o.h, overflow: 'visible' });
      svgEl('use', { href: '#' + o.castId }, cast);
      Object.assign(cast.style, { left: -o.ax + 'px', top: -o.foot + 'px', filter: 'brightness(0) blur(2.4px)' });
      sh.appendChild(cast);
      a.cast = cast;
    }
    if (o.banner) {
      const b = svgEl('svg', { viewBox: '0 0 150 40', width: 66, height: 17.6, overflow: 'visible', class: 'a-banner' });
      Object.assign(b.style, { position: 'absolute', left: '-33px', top: -(o.foot + 26) + 'px' });
      svgEl('path', { d: 'M22 13 L4 13 L11 22.5 L4 32 L26 32 Z', fill: '#e6d6b2', stroke: INK, 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, b);
      svgEl('path', { d: 'M128 13 L146 13 L139 22.5 L146 32 L124 32 Z', fill: '#e6d6b2', stroke: INK, 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, b);
      svgEl('path', { d: 'M18 8 Q75 3 132 8 L132 30 Q75 25 18 30 Z', fill: PARCH, stroke: INK, 'stroke-width': 1.4, 'stroke-linejoin': 'round' }, b);
      svgEl('path', { d: 'M22 11.5 Q75 6.8 128 11.5 M22 26.6 Q75 21.8 128 26.6', fill: 'none', stroke: '#c99a3e', 'stroke-width': 0.8 }, b);
      const tx = svgEl('text', { x: 75, y: 23.2, 'text-anchor': 'middle', 'font-size': o.banner.length > 8 ? 12 : 15.5, fill: INK }, b);
      tx.style.fontFamily = /[㐀-鿿]/.test(o.banner) ? 'var(--serif)' : 'var(--black)';

    }
    actors.push(a);
    return a;
  }
  function renderActor(a, t) {
    const up = clamp(-a.rx / 90, 0, 1.2);
    a.el.style.transform = `translate3d(${a.x.toFixed(2)}px, ${a.y.toFixed(2)}px, .3px)`;
    a.el.style.opacity = a.a;
    a.el.style.visibility = a.a > 0.001 ? 'visible' : 'hidden';
    a.stand.style.transform = `rotateX(${a.rx}deg) translate3d(0, ${-a.lift}px, 0)`;
    a.figWrap.style.transform = `rotateY(${a.spin}deg) rotateZ(${a.tip}deg)`;
    const k = Math.min(1, up) * clamp(1 - a.lift / 140, 0.25, 1);
    a.blob.style.opacity = (k * 0.9).toFixed(3);
    if (a.cast) {
      a.cast.style.opacity = (0.16 * Math.min(1, up) * clamp(1 - a.lift / 60, 0, 1)).toFixed(3);
      a.cast.style.transform = `scaleY(${0.5 * Math.min(1, up)}) rotateY(${a.spin}deg)`;
    }
    if (a.banner) {
      a.banner.style.opacity = a.bannerK;
      a.banner.style.transform = `translate3d(0, ${Math.sin(t * 2.2 + a.x) * 1.2}px, 0) scale(${lerp(0.2, 1, a.bannerK)}, ${lerp(0.6, 1, a.bannerK)})`;
    }
  }

  const knights = [];
  let knightN = 0;
  function makeKnight(o) {
    const id = 'k' + knightN++;
    const fig = new Figure(Object.assign({ id, phase: knightN * 1.3 }, o));
    const W_ = FIG_W * FIG_S, H_ = FIG_H * FIG_S;
    const actor = makeActor({ name: o.name, svg: fig.svg, x: o.x, y: o.y, w: W_, h: H_, ax: W_ / 2, foot: GROUND * FIG_S, castId: id + '-rig', viewBox: `0 0 ${FIG_W} ${FIG_H}`, banner: o.banner });
    const k = { fig, s: fig.s, a: actor, o,
      // body-local point (svg units) → page offset from the actor's foot point
      point(x, y) { const mx = o.mirror ? FIG_W - (x + fig.s.bx) : x + fig.s.bx; return { dx: (mx - FIG_W / 2) * FIG_S, h: (GROUND - (y + fig.s.by)) * FIG_S }; },
    };
    knights.push(k);
    return k;
  }

  const snails = [];
  function makeSnail(o = {}) {
    const SN = o.scale || 0.64;
    const parts = buildSnailSVG(SN);
    const actor = makeActor({ name: 'snail', svg: parts.svg, x: o.x != null ? o.x : 60, y: o.y != null ? o.y : WORD.base + 300, w: 80 * SN, h: 60 * SN, ax: 40 * SN, foot: 58 * SN });
    const sn = { parts, a: actor, state: { crawl: 0, sign: 0, drawn: 0 }, signs: [] };
    snails.push(sn);
    return sn;
  }
  function renderSnail(sn, t) {
    const sp = sn.parts, st = sn.state;
    const c = st.crawl * (sn.a.a > 0 ? 1 : 0);
    const k = Math.sin(t * 5.5) * 0.045 * c;
    sp.body.setAttribute('transform', `translate(4 58) scale(${1 + k} ${1 - k * 0.6}) translate(-4 -58)`);
    sp.shell.setAttribute('transform', `translate(${Math.sin(t * 5.5 + 0.8) * 0.8 * c} ${-Math.abs(Math.sin(t * 5.5)) * 0.6 * c})`);
    sp.sign.setAttribute('opacity', st.sign);
    sp.sign.setAttribute('transform', `translate(54 50) scale(${lerp(0.4, 1, st.sign)}) rotate(${Math.sin(t * 3) * 3 * st.sign}) translate(-54 -50)`);
    let txt = '';
    for (const [tt, s] of sn.signs) if (t >= tt) txt = s;
    if (sp.num.textContent !== txt) sp.num.textContent = txt;
    sp.svg.style.setProperty('--draw', st.drawn);
    sp.svg.style.setProperty('--fill', st.drawn);
  }

  /* ------------------------------------------------------------------ */
  /* Sprites: sparks, ink stars, parchment tags, dust                    */
  /* ------------------------------------------------------------------ */

  function rise(t0 = 0) {
    to(stage, { video: 0, duration: 0.35, ease: 'none' }, t0);
    to(stage, { phone: 0, duration: 1.0, ease: 'power2.inOut' }, t0 + 0.35);
    to(stage, { floor: 1, duration: 0.9, ease: 'power1.inOut' }, t0 + 0.45);
    to(stage, { plate: 0, duration: 1.1, ease: 'power2.inOut' }, t0 + 0.6);
    to(stage, { sky: 1, duration: 1.6, ease: 'power1.inOut' }, t0 + 1.4);
    const span = Math.max(1.72 * WORD.w, 3.2 * WORD.h), pspan = Math.max(1.2 * WORD.w, 2.4 * WORD.h);
    shot(t0 + 1.2, { fit: 1, span, pspan, tilt: 60, x: WORD.cx, y: WORD.base - 0.26 * WORD.h, z: 0.36 * WORD.h, oy: 0.1 }, 3.0, 'power3.inOut');
    const gap = Math.min(0.25, 1.2 / glyphs.length);
    glyphs.forEach((g, i) => {
      const t = t0 + 1.7 + i * gap;
      to(g, { rx: -90, duration: 1.6, ease: 'back.out(1.35)' }, t);
      to(g, { face: 1, duration: 0.7, ease: 'power1.inOut' }, t + 0.1);
      to(g, { depth: 1, duration: 1.3, ease: 'power2.out' }, t + 0.15);
      if (i < 6) { sfx(t, 'whoosh', 1.1); sfx(t + 0.62, 'thock'); }
    });
    shot(t0 + 4.2, { yaw: -10, tilt: 66, span: span * 0.95, pspan: pspan * 0.97 }, 5.2, 'sine.inOut');
    const t1s = $$('#title .t1 span'), t2s = $$('#title .t2 span');
    tl.fromTo(t1s, { opacity: 0, y: 22, filter: 'blur(12px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.14, ease: 'expo.out' }, t0 + 4.4);
    tl.fromTo(t2s, { opacity: 0, y: 12, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.0, ease: 'expo.out' }, t0 + 5.0);
    tl.to([...t1s, ...t2s], { opacity: 0, y: -10, filter: 'blur(8px)', duration: 0.6, stagger: 0.05, ease: 'power2.in' }, t0 + 8.4);
    return t0 + 9.0;
  }

  // ∞ · everything lies back down and the device returns, now with the doodles on the page
  function finale(t0, line, { lineDur = 4.8 } = {}) {
    set(stage, { pscale: 0.84, py: -0.045 }, t0 - 0.1);
    to(stage, { lights: 0, duration: 1.0 }, t0 - 0.1);
    shot(t0, { fit: 0, tilt: 0, yaw: 0, x: PAGE_W / 2, y: PAGE_H / 2, z: 0, oy: 0 }, 3.3, 'power3.inOut');
    glyphs.forEach((g, i) => {
      const t = t0 + 0.5 + i * Math.min(0.15, 0.8 / glyphs.length);
      to(g, { rx: 0, duration: 1.0, ease: 'power2.in' }, t);
      to(g, { depth: 0, duration: 0.9, ease: 'power2.in' }, t + 0.1);
      to(g, { face: 0, glow: 0, wob: 0, duration: 0.6 }, t + 0.5);
      if (i < 6) sfx(t + 0.95, 'thock');
    });
    knights.forEach((k) => { to(k.s, { idle: 0, duration: 0.4 }, t0 + 0.6); if (k.a.banner) to(k.a, { bannerK: 0, duration: 0.4 }, t0 + 0.5); });
    actors.forEach((a, i) => { if (a.fold) to(a, { rx: 0, lift: 0, spin: 0, duration: 0.8, ease: 'power2.in' }, t0 + 0.9 + i * 0.12); });
    rings.forEach((R) => {
      to(R, { ropeA: 0, duration: 0.6 }, t0 + 0.6);
      R.posts.forEach((p, i) => to(p, { a: 0, rx: -40, duration: 0.7, ease: 'power2.in' }, t0 + 0.7 + i * 0.06));
    });
    to(stage, { sky: 0, duration: 1.4, ease: 'power1.inOut' }, t0 + 2.0);
    to(stage, { plate: 1, duration: 1.2, ease: 'power2.inOut' }, t0 + 2.4);
    to(stage, { floor: 0, duration: 1.0, ease: 'power2.inOut' }, t0 + 2.9);
    to(stage, { phone: 1, duration: 1.2, ease: 'power2.inOut' }, t0 + 2.6);
    let t = t0 + 3.4;
    if (line) { caption(t, t + lineDur, '', line); sfx(t, 'chord'); t += lineDur; }
    music.stop(t0 + 4.5, 1.4);
    tl.fromTo('#endcard', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: 'power2.out' }, t + 0.2);
    tl.to({}, { duration: 0.1 }, t + 1.3);
    return t + 1.3;
  }

  const S = {
    tl, cam, stage, glyphs, WORD, PAGE: { w: PAGE_W, h: PAGE_H }, GUARD, REST, FIG_S, gsap,
    to, set, sfx, call, caption, card, shot, lights, shake, music, rise, finale, rock,
    ring: makeRing, drawRing, knight: makeKnight, writeIn, snail: makeSnail, snailIn,
    sprite: makeSprite, tag: makeTag, star: (c = '#f4dc92') => makeSprite(starSVG(c)), spark: () => makeSprite(sparkSVG),
    dust: () => makeSprite(dustHTML), dizzy,
    pose: (k, vars, t) => tl.to(k.s, vars, t),
    spotAt: (t, x, y, z = 70, dur = 1.2) => to(stage.spot, { x, y, z, duration: dur, ease: 'power2.inOut' }, t),
  };
  STORY.build(S);
  const TL_DUR = tl.duration();

  /* ------------------------------------------------------------------ */
  /* Render loop                                                         */
  /* ------------------------------------------------------------------ */
  const VID_DUR = SRC.video ? SRC.video.duration : 0;
  let started = false, phase = 'intro';
  const progressEl = $('#progress');
  function render() {
    const t = tl.time();
    applyCamera(t);
    glyphs.forEach(renderGlyph);
    rings.forEach((R) => renderRing(R, t));
    knights.forEach((k) => k.fig.render(t));
    snails.forEach((sn) => renderSnail(sn, t));
    actors.forEach((a) => renderActor(a, t));
    renderDizzy(t);
    sprites.forEach(renderSprite);
    renderStage();
    const vt = phase === 'video' ? vid.currentTime : phase === 'intro' ? 0 : VID_DUR;
    progressEl.style.transform = `scaleX(${((vt + t) / (VID_DUR + TL_DUR)).toFixed(4)})`;
  }

  /* ------------------------------------------------------------------ */
  /* Flow & controls                                                     */
  /* ------------------------------------------------------------------ */
  const intro = $('#intro'), hud = $('#hud');
  let paused = false, hudTimer = null, scribTimer = null;
  const setPauseIcon = () => $('#pauseIcon').setAttribute('d', paused
    ? 'M4.5 2.8v10.4c0 .5.6.8 1 .5l8-5.2c.4-.3.4-.8 0-1.1l-8-5.2c-.4-.2-1 .1-1 .6z'
    : 'M4 2.5h2.6v11H4zM9.4 2.5H12v11H9.4z');
  const pokeHud = () => { hud.classList.add('show'); clearTimeout(hudTimer); hudTimer = setTimeout(() => { if (phase !== 'intro' && !paused) hud.classList.remove('show'); }, 2600); };

  function playVideo() {
    phase = 'video';
    vid.currentTime = 0;
    const p = vid.play();
    if (p && p.catch) p.catch(() => onVideoEnd());
    clearInterval(scribTimer);
    const [w0, w1] = (SRC.video && SRC.video.write) || [0, 0];
    scribTimer = setInterval(() => {
      if (phase !== 'video' || paused) return;
      const ct = vid.currentTime;
      if (ct > w0 && ct < w1 && Math.random() < 0.6) Sound.play('scribble', 0.25);
    }, 180);
  }
  function onVideoEnd() {
    if (phase !== 'video') return;
    phase = 'story';
    clearInterval(scribTimer);
    tl.play(0);
  }
  function start() {
    if (started) return;
    started = true;
    Sound.init();
    gsap.to(intro, { autoAlpha: 0, duration: 0.5, ease: 'power2.out' });
    $('.poster', phone).style.display = 'none';
    pokeHud();
    if (SRC.video) playVideo();
    else { phase = 'video'; setTimeout(onVideoEnd, 900); }
  }
  function replay() {
    Sound.musicStop(0.2);
    Sound.setDrum(false);
    tl.pause(0);
    paused = false; setPauseIcon();
    Sound.resume();
    if (SRC.video) playVideo();
    else { phase = 'video'; setTimeout(onVideoEnd, 600); }
  }
  function togglePause() {
    if (!started) return start();
    paused = !paused;
    setPauseIcon();
    if (phase === 'video') { if (SRC.video) paused ? vid.pause() : vid.play(); }
    else paused ? tl.pause() : tl.play();
    paused ? Sound.suspend() : Sound.resume();
  }
  if (SRC.video) {
    vid.src = vid.src || SRC.video.src;
    vid.addEventListener('ended', onVideoEnd);
    vid.addEventListener('timeupdate', () => { if (vid.duration && vid.currentTime >= vid.duration - 0.03) onVideoEnd(); });
  } else {
    vid.remove();
    $('.poster', phone).style.display = 'none';
  }
  intro.addEventListener('click', start);
  $('#bPause').addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
  $('#bReplay').addEventListener('click', (e) => { e.stopPropagation(); replay(); });
  $('#replay2').addEventListener('click', (e) => { e.stopPropagation(); replay(); });
  $('#bSound').addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.setEnabled(!Sound.enabled);
    $('#soundWaves').style.opacity = Sound.enabled ? 1 : 0.15;
  });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.code === 'ArrowRight' && phase === 'story') tl.seek(Math.min(TL_DUR, tl.time() + 5));
    if (e.code === 'ArrowLeft' && phase === 'story') tl.seek(Math.max(0, tl.time() - 5));
  });
  addEventListener('pointermove', () => started && pokeHud());
  addEventListener('pointerdown', () => started && pokeHud());
  addEventListener('resize', () => { layout(); render(); });
  document.addEventListener('visibilitychange', () => {
    if (!started || paused) return;
    if (document.hidden) { Sound.suspend(); if (phase === 'video' && SRC.video) vid.pause(); else tl.pause(); }
    else { Sound.resume(); if (phase === 'video' && SRC.video) vid.play(); else tl.play(); }
  });

  layout();
  tl.progress(1, true).progress(0, true);   // record every tween's start state
  gsap.ticker.add(render);
  render();

  // capture hooks for scripts/shot.js
  window.__seek = (t) => {
    started = true; phase = 'story';
    intro.style.visibility = 'hidden';
    $('.poster', phone).style.display = 'none';
    tl.pause(); tl.seek(t, true);
    render();
  };
  window.__tl = tl;
  window.__duration = TL_DUR;
  window.__word = WORD;
})();

</script>
</body>
</html>
